<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYOTA Funds Kenya - Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="application-page">

    <header class="header">
        <img src="nyota-logo.png" alt="NYOTA Funds Logo" class="logo">
        <h2>NYOTA FUNDS KENYA</h2>
    </header>

    <main class="application-container">

        <div class="application-card">

            <h1>APPLICATION FORM</h1>

            <form id="applicationForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="idNumber">ID Number</label>
                        <input
                            type="text"
                            id="idNumber"
                            placeholder="Enter ID number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="07XXXXXXXX"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="nextOfKin">Next of Kin</label>
                        <input
                            type="text"
                            id="nextOfKin"
                            placeholder="Enter full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="kinPhone">Next of Kin Phone</label>
                        <input
                            type="tel"
                            id="kinPhone"
                            placeholder="07XXXXXXXX"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="continue-btn">
                    CONTINUE →
                </button>

            </form>

        </div>

    </main>

    <footer>
        <p>© 2026 NYOTA Funds Kenya</p>
    </footer>

</div>

<script>
document.getElementById("applicationForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const applicant = {
        fullName: document.getElementById("fullName").value.trim(),
        idNumber: document.getElementById("idNumber").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        nextOfKin: document.getElementById("nextOfKin").value.trim(),
        kinPhone: document.getElementById("kinPhone").value.trim()
    };

    localStorage.setItem(
        "nyotaApplicant",
        JSON.stringify(applicant)
    );

    window.location.href = "funds.html";
});
</script>

</body>
</html>
