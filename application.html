<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYOTA Funds - Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="application-page">

        <div class="application-card">

            <h1>NYOTA FUNDS KENYA</h1>

            <h2>APPLICATION FORM</h2>

            <p class="form-intro">
                Please enter your details correctly.
            </p>

            <form id="applicationForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="07XXXXXXXX"
                            maxlength="10"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="idNumber">
                            ID Number
                        </label>

                        <input
                            type="text"
                            id="idNumber"
                            name="idNumber"
                            placeholder="Enter ID number"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="nextOfKin">
                            Next of Kin
                        </label>

                        <input
                            type="text"
                            id="nextOfKin"
                            name="nextOfKin"
                            placeholder="Enter next of kin"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="nextOfKinPhone">
                            Next of Kin Phone
                        </label>

                        <input
                            type="tel"
                            id="nextOfKinPhone"
                            name="nextOfKinPhone"
                            placeholder="07XXXXXXXX"
                            maxlength="10"
                            required
                        >
                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-btn">
                    CONTINUE
                </button>

            </form>

        </div>

    </div>


    <script>

        document
            .getElementById("applicationForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const fullName =
                    document.getElementById("fullName")
                    .value
                    .trim();

                const phone =
                    document.getElementById("phone")
                    .value
                    .trim();

                const idNumber =
                    document.getElementById("idNumber")
                    .value
                    .trim();

                const nextOfKin =
                    document.getElementById("nextOfKin")
                    .value
                    .trim();

                const nextOfKinPhone =
                    document.getElementById("nextOfKinPhone")
                    .value
                    .trim();


                if (!fullName ||
                    !phone ||
                    !idNumber ||
                    !nextOfKin ||
                    !nextOfKinPhone) {

                    alert("Please complete all fields.");
                    return;
                }
