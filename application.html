<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYOTA Funds - Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="application-page">

        <section class="application-card">

            <div class="application-header">
                <h1>NYOTA FUNDS KENYA</h1>
                <p>Application Form</p>
            </div>

            <form id="applicationForm">

                <div class="form-section">
                    <h2>Personal Information</h2>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="fullName">Full Names</label>
                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter your full names"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="idNumber">National ID Number</label>
                            <input
                                type="text"
                                id="idNumber"
                                name="idNumber"
                                placeholder="Enter your ID number"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="07XXXXXXXX"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="county">County</label>
                            <select id="county" name="county" required>
                                <option value="">Select your county</option>
                                <option>Nairobi</option>
                                <option>Nakuru</option>
                                <option>Kiambu</option>
                                <option>Mombasa</option>
                                <option>Kisumu</option>
                                <option>Uasin Gishu</option>
                                <option>Machakos</option>
                                <option>Kajiado</option>
                                <option>Meru</option>
                                <option>Nyeri</option>
                                <option>Other</option>
                            </select>
                        </div>

                    </div>
                </div>

                <div class="form-section">
                    <h2>Next of Kin</h2>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="nextOfKin">Next of Kin Full Name</label>
                            <input
                                type="text"
                                id="nextOfKin"
                                name="nextOfKin"
                                placeholder="Enter full name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="nextOfKinPhone">Next of Kin Phone</label>
                            <input
                                type="tel"
                                id="nextOfKinPhone"
                                name="nextOfKinPhone"
                                placeholder="07XXXXXXXX"
                                required
                            >
                        </div>

                    </div>
                </div>

                <div class="form-section">

                    <label class="consent">
                        <input type="checkbox" id="agree" required>
                        <span>
                            I confirm that the information provided is correct.
                        </span>
                    </label>

                </div>

                <button type="submit" class="continue-btn">
                    CONTINUE
                </button>

            </form>

        </section>

    </main>

    <script>
        document.getElementById("applicationForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const application = {
                fullName: document.getElementById("fullName").value.trim(),
                idNumber: document.getElementById("idNumber").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                county: document.getElementById("county").value,
                nextOfKin: document.getElementById("nextOfKin").value.trim(),
                nextOfKinPhone: document.getElementById("nextOfKinPhone").value.trim()
            };

            localStorage.setItem(
                "nyotaApplication",
                JSON.stringify(application)
            );

            window.location.href = "funds.html";
        });
    </script>

</body>
</html>
