<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS - Commitment</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;
    font-family:Arial,sans-serif;
    background:#006400;
    color:#FFFFFF;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.card{
    width:100%;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    padding:22px 18px 20px;
    border-radius:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    border:1px solid #000000;
}

.success{
    width:70px;
    height:70px;
    margin:0 auto 14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#FFD400;
    color:#000000;

    border:2px solid #000000;
    border-radius:50%;

    font-size:38px;
    font-weight:800;
}

h1{
    text-align:center;

    background:#000000;
    color:#FFFFFF;

    font-size:25px;
    font-weight:800;

    margin:2px 0 16px;
    padding:10px;

    border:1px solid #FFFFFF;
    border-radius:10px;
}

p{
    text-align:center;
    font-size:14px;
    line-height:1.6;
    color:#FFFFFF;
}

.name{
    color:#FFD400;
    font-weight:800;
}

.amount{
    background:#000000;
    border:1px solid #FFFFFF;
    border-radius:12px;

    padding:17px 10px;
    margin:18px 0;

    text-align:center;

    color:#FFD400;

    font-size:27px;
    font-weight:800;
}

.info{
    margin-top:18px;

    background:#000000;

    border:1px solid #FFFFFF;
    border-radius:12px;

    padding:14px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    padding:10px 0;

    border-bottom:1px solid
        rgba(255,255,255,0.25);
}

.row:last-child{
    border-bottom:none;
}

.label{
    font-size:13px;
    color:#FFFFFF;
}

.value{
    font-size:14px;
    font-weight:800;
    color:#FFD400;
    text-align:right;
    word-break:break-word;
}

.notice{
    margin-top:18px;

    padding:13px;

    background:rgba(255,212,0,0.12);

    border:1px solid #FFD400;
    border-radius:10px;

    color:#FFFFFF;

    font-size:13px;
    line-height:1.5;

    text-align:center;
}

.accept{
    display:flex;
    align-items:flex-start;

    gap:10px;

    margin-top:18px;

    padding:13px;

    background:#000000;

    border:1px solid #FFFFFF;
    border-radius:10px;
}

.accept input{
    width:20px;
    height:20px;
    margin-top:2px;

    accent-color:#FFD400;
}

.accept label{
    font-size:13px;
    line-height:1.5;
    color:#FFFFFF;
}

button{
    width:100%;
    padding:15px;
    margin-top:18px;

    background:#FFD400;
    color:#000000;

    border:1px solid #000000;
    border-radius:11px;

    font-size:16px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30);
}

button:active{
    transform:scale(.98);
}

button:disabled{
    background:rgba(255,255,255,0.25);
    color:#FFFFFF;

    cursor:not-allowed;
    box-shadow:none;
}

#message{
    min-height:22px;

    margin-top:13px;

    color:#FFD400;

    font-size:13px;
    font-weight:600;

    line-height:1.5;

    text-align:center;
}

.footer{
    margin-top:15px;

    text-align:center;

    font-size:12px;

    color:#FFFFFF;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:18px 13px 15px;
        border-radius:15px;
    }

    h1{
        font-size:22px;
    }

    button{
        padding:14px;
        font-size:15px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="success">
    ✓
</div>

<h1>
    Congratulations 🎊🎉🎊💸
</h1>

<p>
    We have received your delivery fee.
</p>

<p>
    Welcome,
    <span class="name" id="name">
        Applicant
    </span>
</p>

<div class="amount">
    Commitment Fee: KSh 2
</div>

<div class="info">

    <div class="row">

        <div class="label">
            M-PESA Number
        </div>

        <div
            class="value"
            id="phone"
        >
            —
        </div>

    </div>

    <div class="row">

        <div class="label">
            Commitment Fee
        </div>

        <div class="value">
            KSh 2
        </div>

    </div>

</div>

<div class="notice">

    Please review the commitment fee
    information carefully before continuing.

</div>

<div class="accept">

    <input
        type="checkbox"
        id="acceptFee"
        onchange="updateButton()"
    >

    <label for="acceptFee">

        I have reviewed the KSh 2 commitment
        fee and voluntarily accept the terms
        before continuing.

    </label>

</div>

<button
    type="button"
    id="continueBtn"
    disabled
    onclick="continueCommitment()"
>
    Accept & Continue
</button>

<p id="message"></p>

<div class="footer">
    NYOTA FUNDS
</div>

</div>

</div>

<script>

/* =====================================================
   APPLICANT
===================================================== */

const applicant =
    localStorage.getItem("applicantName") ||
    localStorage.getItem("fullName") ||
    "Applicant";

document.getElementById("name")
    .textContent = applicant;


/* =====================================================
   PHONE
===================================================== */

const savedPhone =
    localStorage.getItem("phoneNumber") || "";

document.getElementById("phone")
    .textContent =
        savedPhone || "Not available";


/* =====================================================
   DELIVERY PAYMENT PROTECTION
===================================================== */

const deliveryStatus =
    localStorage.getItem(
        "deliveryPaymentStatus"
    ) || "";

if(deliveryStatus !== "COMPLETED"){

    document.querySelector(".card")
        .innerHTML = `

        <div class="success">
            !
        </div>

        <h1>
            Payment Verification
        </h1>

        <p>
            Your delivery payment has not
            been confirmed yet.
        </p>

        <button
            type="button"
            onclick="
                window.location.href='delivery.html'
            "
        >
            Return to Delivery
        </button>

    `;

}


/* =====================================================
   ENABLE BUTTON
===================================================== */

function updateButton(){

    const checkbox =
        document.getElementById(
            "acceptFee"
        );

    const button =
        document.getElementById(
            "continueBtn"
        );

    button.disabled =
        !checkbox.checked;

}


/* =====================================================
   ACCEPT COMMITMENT
===================================================== */

function continueCommitment(){

    const checkbox =
        document.getElementById(
            "acceptFee"
        );

    const button =
        document.getElementById(
            "continueBtn"
        );

    const message =
        document.getElementById(
            "message"
        );


    if(!checkbox.checked){

        message.textContent =
            "Please accept the commitment terms before continuing.";

        return;

    }


    /* -----------------------------------------
       SAVE ACCEPTANCE
    ----------------------------------------- */

    localStorage.setItem(
        "commitmentAccepted",
        "YES"
    );

    localStorage.setItem(
        "commitmentFee",
        "2"
    );

    localStorage.setItem(
        "commitmentAcceptedAt",
        new Date().toISOString()
    );


    button.disabled = true;

    button.textContent =
        "Accepted ✓";


    message.textContent =
        "Commitment accepted. Continuing...";


    /* -----------------------------------------
       NEXT PAGE
    ----------------------------------------- */

    setTimeout(function(){

        window.location.replace(
            "Confirmation.html"
        );

    },1000);

}

</script>

</body>

</html>
