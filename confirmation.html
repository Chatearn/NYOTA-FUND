<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Summary</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #111;
            min-height: 100vh;
        }

        .header {
            background: #00843d;
            padding: 22px 20px;
            text-align: center;
            border-bottom: 5px solid #111;
        }

        .header h1 {
            color: #fff;
            font-size: 25px;
            font-weight: 800;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .check {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #00843d;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 800;
        }

        h2 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .welcome {
            text-align: center;
            color: #555;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .details {
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 17px 0;
            border-bottom: 1px solid #eee;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
            font-size: 14px;
        }

        .value {
            font-weight: 800;
            text-align: right;
        }

        .continue-btn,
        .back-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .continue-btn {
            background: #00843d;
            color: #fff;
            margin-bottom: 10px;
        }

        .continue-btn:hover {
            background: #006b31;
        }

        .back-btn {
            background: #111;
            color: #fff;
        }

        .error {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            background: #ffe8e8;
            color: #a00000;
            border-radius: 7px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .card {
                padding: 28px 20px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>PRIVATE FUNDS SERVICE</h1>
</header>

<main class="container">

    <div class="card">

        <div class="check">✓</div>

        <h2>Application Summary</h2>

        <p class="welcome">
            Please review your selected fund amount before continuing.
        </p>

        <div id="error" class="error"></div>

        <div class="details">

            <div class="row">
                <span class="label">Application ID</span>
                <span class="value" id="applicationId">—</span>
            </div>

            <div class="row">
                <span class="label">Full Name</span>
                <span class="value" id="fullName">—</span>
            </div>

            <div class="row">
                <span class="label">Selected Amount</span>
                <span class="value" id="fundAmount">—</span>
            </div>

            <div class="row">
                <span class="label">Processing Fee</span>
                <span class="value" id="processingFee">—</span>
            </div>

            <div class="row">
                <span class="label">Status</span>
                <span class="value" id="status">—</span>
            </div>

        </div>

        <button class="continue-btn" onclick="continueNext()">
            CONTINUE
        </button>

        <button class="back-btn" onclick="goBack()">
            BACK
        </button>

    </div>

</main>

<script>

    /*
       Read the application returned by the backend.
    */

    const backendApplication =
        JSON.parse(
            localStorage.getItem("nyotaBackendApplication")
        );

    /*
       Also read the original application details.
    */

    const application =
        JSON.parse(
            localStorage.getItem("nyotaApplication")
        );

    /*
       Display backend application if available.
    */

    if (backendApplication) {

        document.getElementById("applicationId").textContent =
            backendApplication.id || "—";

        document.getElementById("fullName").textContent =
            backendApplication.fullName || "—";

        document.getElementById("fundAmount").textContent =
            "KSh " +
            Number(backendApplication.fundAmount).toLocaleString();

        document.getElementById("processingFee").textContent =
            "KSh " +
            Number(backendApplication.processingFee).toLocaleString();

        document.getElementById("status").textContent =
            backendApplication.status || "pending";

    }

    /*
       Fallback for the existing localStorage data.
    */

    else {

        const fundAmount =
            localStorage.getItem("nyotaFundAmount");

        const processingFee =
            localStorage.getItem("nyotaProcessingFee");

        if (application) {

            document.getElementById("fullName").textContent =
                application.fullName || "—";

        }

        if (fundAmount) {

            document.getElementById("fundAmount").textContent =
                "KSh " +
                Number(fundAmount).toLocaleString();

        }

        if (processingFee) {

            document.getElementById("processingFee").textContent =
                "KSh " +
                Number(processingFee).toLocaleString();

        }

        document.getElementById("status").textContent =
            "Pending";

    }


    function continueNext() {

        window.location.href = "payment.html";

    }


    function goBack() {

        window.location.href = "funds.html";

    }

</script>

</body>
</html>
