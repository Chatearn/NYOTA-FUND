<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYOTA Funds Kenya - Confirmation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #111;
            min-height: 100vh;
        }

        .header {
            background: #00843d;
            padding: 22px 20px;
            text-align: center;
            border-bottom: 5px solid #111;
        }

        .header h1 {
            color: #fff;
            font-size: 25px;
            font-weight: 800;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .confirmation-card {
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            text-align: center;
        }

        .check {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #00843d;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 800;
        }

        h2 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .welcome {
            font-size: 17px;
            margin-bottom: 28px;
            color: #444;
        }

        .details {
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            margin-bottom: 25px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 17px 0;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-size: 14px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 800;
            text-align: right;
        }

        .continue-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 7px;
            background: #00843d;
            color: #fff;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .continue-btn:hover {
            background: #006b31;
        }

        @media (max-width: 600px) {

            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .confirmation-card {
                padding: 28px 20px;
            }

            h2 {
                font-size: 22px;
            }

            .detail-value {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>NYOTA FUNDS KENYA</h1>
</header>

<main class="container">

    <div class="confirmation-card">

        <div class="check">✓</div>

        <h2>Application Details</h2>

        <p class="welcome">
            <span id="clientName">Applicant</span>, your selected details are shown below.
        </p>

        <div class="details">

            <div class="detail-row">
                <span class="detail-label">Full Name</span>
                <span class="detail-value" id="fullName">—</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Selected Fund</span>
                <span class="detail-value" id="fundAmount">—</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Processing Fee</span>
                <span class="detail-value" id="processingFee">—</span>
            </div>

        </div>

        <button class="continue-btn" onclick="continueNext()">
            CONTINUE
        </button>

    </div>

</main>

<script>

    const application = JSON.parse(
        localStorage.getItem("nyotaApplication")
    );

    const fundAmount = localStorage.getItem(
        "nyotaFundAmount"
    );

    const processingFee = localStorage.getItem(
        "nyotaProcessingFee"
    );


    if (application) {

        document.getElementById("fullName").textContent =
            application.fullName || "—";

        document.getElementById("clientName").textContent =
            application.fullName || "Applicant";

    }


    if (fundAmount) {

        document.getElementById("fundAmount").textContent =
            "KSh " + Number(fundAmount).toLocaleString();

    }


    if (processingFee) {

        document.getElementById("processingFee").textContent =
            "KSh " + Number(processingFee).toLocaleString();

    }


    function continueNext() {

        window.location.href = "payment.html";

    }

</script>

</body>
</html>
