<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;
    font-family:Arial,sans-serif;
    background:#006400;
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.card{
    width:100%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    padding:25px 18px 22px;
    border-radius:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    border:1px solid #000000;

    text-align:center;
}

h1{
    margin:2px 0 18px;

    color:#FFD400;

    font-size:28px;
    font-weight:800;
}

.congratulations{
    font-size:21px;
    font-weight:800;
    line-height:1.4;

    color:#FFFFFF;

    margin-bottom:18px;
}

.congratulations span{
    color:#FFD400;
}

.message{
    font-size:15px;
    line-height:1.6;

    color:#FFFFFF;

    margin-bottom:20px;
}

.status{
    width:100%;

    padding:15px 12px;

    background:#000000;

    color:#FFFFFF;

    border:1px solid #FFFFFF;
    border-radius:12px;

    font-size:15px;
    font-weight:600;

    margin-bottom:18px;
}

.status strong{
    color:#FFD400;
}

button{
    width:100%;

    padding:15px;

    background:#FFD400;

    color:#000000;

    border:1px solid #000000;

    border-radius:11px;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30);
}

button:hover{
    background:#FFD400;
}

button:active{
    transform:scale(.98);
}

#message{
    min-height:20px;

    margin-top:13px;

    color:#FFD400;

    font-size:13px;
    font-weight:600;

    line-height:1.5;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:22px 13px 18px;
        border-radius:15px;
    }

    h1{
        font-size:24px;
    }

    .congratulations{
        font-size:19px;
    }

    .message{
        font-size:14px;
    }

    button{
        padding:14px;
        font-size:15px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>NYOTA Funds</h1>

<div class="congratulations">

Congratulations 🎊🎊

<br>

<span id="firstName">Applicant</span>

</div>

<p class="message">

Your payment has been successfully confirmed.

<br><br>

Your application has now moved to the next stage.

</p>

<div class="status">

Payment Status:
<strong>Successful</strong>

</div>

<button
    type="button"
    onclick="continueApplication()"
    id="continueBtn"
>
    Continue
</button>

<p id="message"></p>

</div>

</div>


<script>

/* =====================================================
   APPLICANT NAME
===================================================== */

const applicantName =
    localStorage.getItem("applicantName") ||
    localStorage.getItem("fullName") ||
    "Applicant";


/* =====================================================
   GET FIRST NAME
===================================================== */

const firstName =
    applicantName
        .trim()
        .split(/\s+/)[0];


document.getElementById(
    "firstName"
).textContent =
    firstName || "Applicant";


/* =====================================================
   CHECK PAYMENT STATUS
===================================================== */

const paymentStatus =
    localStorage.getItem("paymentStatus");


/*
   This page is intended to be reached
   after the processing payment has been
   successfully confirmed.
*/

if(
    paymentStatus !== "COMPLETED"
){

    document.getElementById(
        "message"
    ).textContent =
        "Payment confirmation is required before continuing.";

}


/* =====================================================
   CONTINUE
===================================================== */

function continueApplication(){

    const button =
        document.getElementById(
            "continueBtn"
        );

    const message =
        document.getElementById(
            "message"
        );


    if(
        paymentStatus !== "COMPLETED"
    ){

        message.textContent =
            "Please wait for your payment to be confirmed.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "Loading...";


    message.textContent =
        "Continuing your application...";


    setTimeout(function(){

        /*
           Change this destination only when
           your next legitimate application
           page is ready.
        */

        window.location.href =
            "success.html";

    },500);

}

</script>

</body>

</html>
