<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYOTA FUNDS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #00A651;
            color: #FFFFFF;
            min-height: 100vh;
        }

        /* ================================
           TOP LOGO SECTION
        ================================= */

        .top-logo {
            width: 100%;
            height: 300px;
            background: #FFFFFF;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .top-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ================================
           MAIN CONTENT
        ================================= */

        .main-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 35px 20px 50px;
            text-align: center;
        }

        .main-container h1 {
            color: #FFD400;
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .main-container .subtitle {
            color: #FFFFFF;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* ================================
           WELCOME CARD
        ================================= */

        .welcome-card {
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 16px;
            padding: 30px 20px;
            margin: 0 auto 30px;
            max-width: 700px;
        }

        .welcome-card h2 {
            color: #00A651;
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .welcome-card p {
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.6;
        }

        /* ================================
           BUTTONS
        ================================= */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;

            min-width: 220px;
            padding: 16px 25px;

            border: 3px solid #000000;
            border-radius: 10px;

            font-size: 18px;
            font-weight: 900;
            text-decoration: none;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .apply-now {
            background: #FFD400;
            color: #000000;
        }

        .apply-later {
            background: #FFFFFF;
            color: #000000;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* ================================
           FOOTER
        ================================= */

        footer {
            width: 100%;
            background: #000000;
            color: #FFFFFF;
            text-align: center;
            padding: 18px 10px;
            font-size: 13px;
            font-weight: bold;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .top-logo {
                height: 220px;
            }

            .top-logo img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .main-container {
                padding: 28px 14px 40px;
            }

            .main-container h1 {
                font-size: 27px;
            }

            .main-container .subtitle {
                font-size: 16px;
            }

            .welcome-card {
                padding: 25px 16px;
            }

            .welcome-card h2 {
                font-size: 23px;
            }

            .welcome-card p {
                font-size: 15px;
            }

            .buttons {
                flex-direction: column;
                width: 100%;
                gap: 12px;
            }

            .btn {
                width: 100%;
                min-width: 0;
            }
        }

        /* ================================
           VERY SMALL SCREENS
        ================================= */

        @media (max-width: 380px) {

            .top-logo {
                height: 190px;
            }

            .main-container h1 {
                font-size: 24px;
            }

            .welcome-card h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- =================================
         NYOTA FUND LOGO
    ================================== -->

    <div class="top-logo">
        <img
            src="nyota-logo.jpg"
            alt="NYOTA FUND Logo"
        >
    </div>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <main class="main-container">

        <h1>
            WELCOME TO NYOTA FUNDS KENYA
        </h1>

        <p class="subtitle">
            Supporting opportunities and advancement for young people.
        </p>


        <section class="welcome-card">

            <h2>
                NYOTA FUNDS
            </h2>

            <p>
                Welcome to the NYOTA Funds platform.
                Select an option below to continue.
            </p>

        </section>


        <!-- =================================
             ACTION BUTTONS
        ================================== -->

        <div class="buttons">

            <a
                href="registration.html"
                class="btn apply-now"
            >
                APPLY NOW
            </a>

            <a
                href="registration.html"
                class="btn apply-later"
            >
                APPLY LATER
            </a>

        </div>

    </main>


    <!-- =================================
         FOOTER
    ================================== -->

    <footer>
        © 2026 NYOTA FUNDS
    </footer>

</body>
</html>
