<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA Funds</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,212,0,0.08),
            rgba(0,166,81,0.08) 25%,
            transparent 60%
        ),
        linear-gradient(
            180deg,
            #00A651 0%,
            #00A651 50%,
            #00A651 100%
        );

    color:#FFFFFF;
}

.container{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    padding:12px 16px;
}

.card{
    width:100%;
    padding:20px 16px;
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    border:1px solid #000000;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.05);
}

h1{
    text-align:center;
    color:#000000;
    font-size:30px;
    font-weight:700;
    margin-bottom:10px;
}

.message{
    text-align:center;
    font-size:16px;
    line-height:1.5;
    margin-bottom:18px;
    color:#FFFFFF;
}

.message b{
    color:#000000;
}

h2{
    text-align:center;
    color:#000000;
    font-size:21px;
    font-weight:700;
    margin-bottom:12px;
}

.amount-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.amount-btn{
    width:100%;

    background:rgba(0,0,0,0.10);
    color:#FFFFFF;

    border:1px solid #000000;
    border-radius:13px;

    padding:13px 8px;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}

.amount-btn:hover{
    border-color:#000000;
    transform:translateY(-1px);
}

.amount-btn.selected{
    background:#FFD400;
    color:#000000;
    border-color:#000000;
}

#feeDisplay{
    margin:15px 0;
    padding:12px;

    text-align:center;

    font-size:15px;
    line-height:1.4;

    color:#FFFFFF;

    background:rgba(0,0,0,0.10);

    border:1px solid #000000;
    border-radius:11px;

    min-height:48px;
}

#feeDisplay span{
    color:#000000;
    font-size:20px;
    font-weight:700;
}

.continue-btn{
    width:100%;
    padding:14px;

    background:#FFD400;
    color:#000000;

    border:1px solid #000000;
    border-radius:13px;

    font-size:19px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.15);

    transition:
        transform .2s ease,
        opacity .2s ease;
}

.continue-btn:hover{
    transform:translateY(-2px);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

#flowMessage{
    min-height:20px;
    margin-top:10px;

    text-align:center;

    font-size:13px;
    color:#000000;
}

@media(max-width:360px){

    .container{
        padding:10px 12px;
    }

    .card{
        padding:18px 13px;
    }

    h1{
        font-size:25px;
    }

    .message{
        font-size:14px;
    }

    h2{
        font-size:19px;
    }

    .amount-btn{
        font-size:16px;
        padding:12px 6px;
    }

    .continue-btn{
        font-size:18px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>NYOTA Funds</h1>

<div class="message">

Welcome,
<b id="applicantName">Applicant</b>.

<br><br>

Choose the amount you would like to request and
review the applicable service fee before continuing.

</div>

<h2>Select Amount</h2>

<div class="amount-grid">

<button
    type="button"
    class="amount-btn"
    data-amount="22000"
    onclick="selectAmount(22000,this)">
    KSh 22,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="30000"
    onclick="selectAmount(30000,this)">
    KSh 30,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="40000"
    onclick="selectAmount(40000,this)">
    KSh 40,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="50000"
    onclick="selectAmount(50000,this)">
    KSh 50,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="65000"
    onclick="selectAmount(65000,this)">
    KSh 65,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="75000"
    onclick="selectAmount(75000,this)">
    KSh 75,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="85000"
    onclick="selectAmount(85000,this)">
    KSh 85,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="110000"
    onclick="selectAmount(110000,this)">
    KSh 110,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="150000"
    onclick="selectAmount(150000,this)">
    KSh 150,000
</button>

</div>

<div id="feeDisplay">
Select an amount to see the applicable service fee.
</div>

<button
    type="button"
    class="continue-btn"
    id="continueBtn"
    onclick="continueNext">

    Continue

</button>

<div id="flowMessage"></div>

</div>

</div>

<script>

/* =========================================
   FEE TABLE
========================================= */

const fees = {

    22000: 350,

    30000: 400,

    40000: 460,

    50000: 520,

    65000: 660,

    75000: 780,

    85000: 910,

    110000: 1240,

    150000: 1500

};


/* =========================================
   APPLICANT
========================================= */

const applicant =
    localStorage.getItem("applicantName");

document.getElementById(
    "applicantName"
).textContent =
    applicant || "Applicant";


/* =========================================
   CURRENT SELECTION
========================================= */

let selectedAmount = null;


/* =========================================
   RESTORE PREVIOUS SELECTION
========================================= */

const savedAmount =
    Number(
        localStorage.getItem(
            "selectedAmount"
        )
    );

if(
    savedAmount &&
    fees[savedAmount]
){

    const savedButton =
        document.querySelector(
            `[data-amount="${savedAmount}"]`
        );

    if(savedButton){

        selectAmount(
            savedAmount,
            savedButton
        );

    }

}


/* =========================================
   SELECT AMOUNT
========================================= */

function selectAmount(amount, button){

    if(!fees[amount]){
        return;
    }

    selectedAmount =
        Number(amount);

    document
        .querySelectorAll(".amount-btn")
        .forEach(function(item){

            item.classList.remove(
                "selected"
            );

        });

    button.classList.add(
        "selected"
    );

    const processingFee =
        fees[selectedAmount];

    document.getElementById(
        "feeDisplay"
    ).innerHTML =

        "Service Fee: " +

        "<span>KSh " +

        processingFee
            .toLocaleString() +

        "</span>";

    localStorage.setItem(
        "selectedAmount",
        String(selectedAmount)
    );

    localStorage.setItem(
        "processingFee",
        String(processingFee)
    );

    localStorage.setItem(
        "selectedAmountFormatted",
        "KSh " +
        selectedAmount.toLocaleString()
    );

}


/* =========================================
   CONTINUE
========================================= */

function continueNext(){

    const button =
        document.getElementById(
            "continueBtn"
        );

    const message =
        document.getElementById(
            "flowMessage"
        );

    if(
        selectedAmount === null
    ){

        message.textContent =
            "Please select an amount first.";

        return;

    }

    const processingFee =
        fees[selectedAmount];

    if(!processingFee){

        message.textContent =
            "Unable to determine the service fee.";

        return;

    }

    localStorage.setItem(
        "selectedAmount",
        String(selectedAmount)
    );

    localStorage.setItem(
        "processingFee",
        String(processingFee)
    );

    button.disabled = true;

    button.textContent =
        "Continue...";

    message.textContent =
        "Preparing your payment page...";

    setTimeout(function(){

        window.location.href =
            "payment.html";

    },500);

}

</script>

</body>
</html>
