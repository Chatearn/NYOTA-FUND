<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA Funds</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    /* GREEN BACKGROUND */
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,212,0,0.08),
            rgba(0,166,81,0.08) 25%,
            transparent 60%
        ),
        linear-gradient(
            180deg,
            #00A651 0%,
            #00A651 50%,
            #00A651 100%
        );

    /* PURE WHITE */
    color:#FFFFFF;
}

.container{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    padding:12px 16px;
}

.card{
    width:100%;
    padding:20px 16px;
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    /* BLACK FRAME */
    border:1px solid #000000;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.05);
}

h1{
    text-align:center;

    /* BLACK LETTERS */
    color:#000000;

    font-size:30px;
    font-weight:700;
    margin-bottom:10px;
}

.message{
    text-align:center;
    font-size:16px;
    line-height:1.5;
    margin-bottom:18px;

    /* PURE WHITE */
    color:#FFFFFF;
}

.message b{
    /* BLACK LETTERS */
    color:#000000;
}

h2{
    text-align:center;

    /* BLACK LETTERS */
    color:#000000;

    font-size:21px;
    font-weight:700;
    margin-bottom:12px;
}

.amount-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.amount-btn{
    width:100%;

    background:rgba(0,0,0,0.10);

    /* PURE WHITE */
    color:#FFFFFF;

    /* BLACK FRAME */
    border:1px solid #000000;

    border-radius:13px;

    padding:13px 8px;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}

.amount-btn:hover{

    /* BLACK FRAME */
    border-color:#000000;

    transform:translateY(-1px);
}

.amount-btn.selected{

    /* PURE YELLOW */
    background:#FFD400;

    /* BLACK LETTERS */
    color:#000000;

    /* BLACK FRAME */
    border-color:#000000;
}

#feeDisplay{
    margin:15px 0;
    padding:12px;

    text-align:center;

    font-size:15px;
    line-height:1.4;

    /* PURE WHITE */
    color:#FFFFFF;

    background:rgba(0,0,0,0.10);

    /* BLACK FRAME */
    border:1px solid #000000;

    border-radius:11px;

    min-height:48px;
}

#feeDisplay span{

    /* BLACK LETTERS */
    color:#000000;

    font-size:20px;
    font-weight:700;
}

.continue-btn{
    width:100%;
    padding:14px;

    /* PURE YELLOW */
    background:#FFD400;

    /* BLACK LETTERS */
    color:#000000;

    /* BLACK FRAME */
    border:1px solid #000000;

    border-radius:13px;

    font-size:19px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.15);

    transition:
        transform .2s ease,
        opacity .2s ease;
}

.continue-btn:hover{
    transform:translateY(-2px);
}

.continue-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

#flowMessage{
    min-height:20px;
    margin-top:10px;

    text-align:center;

    font-size:13px;

    /* BLACK LETTERS */
    color:#000000;
}

@media(max-width:360px){

    .container{
        padding:10px 12px;
    }

    .card{
        padding:18px 13px;
    }

    h1{
        font-size:25px;
    }

    .message{
        font-size:14px;
    }

    h2{
        font-size:19px;
    }

    .amount-btn{
        font-size:16px;
        padding:12px 6px;
    }

    .continue-btn{
        font-size:18px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>NYOTA Funds</h1>

<div class="message">

Welcome,
<b id="applicantName">Applicant</b>.

<br><br>

Choose the amount you would like to request and
review the applicable service fee before continuing.

</div>

<h2>Select Amount</h2>

<div class="amount-grid">

<button
    type="button"
    class="amount-btn"
    data-amount="22000"
    onclick="selectAmount(22000,this)">
    KSh 22,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="30000"
    onclick="selectAmount(30000,this)">
    KSh 30,000
</button>

<button
    type="button"
    class="amount-btn"
    data-amount="40000"
    onclick="selectAmount(40000,this)">
    KSh 40,000
