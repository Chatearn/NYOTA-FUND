<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYOTA Funds Kenya - Fund Selection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #111;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #00843d;
            padding: 22px 20px;
            text-align: center;
            border-bottom: 5px solid #111;
        }

        .header h1 {
            color: #fff;
            font-size: 25px;
            font-weight: 800;
        }

        /* Main */
        .container {
            width: 100%;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .funds-card {
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        /* Congratulations */
        .congratulations {
            text-align: center;
            margin-bottom: 30px;
        }

        .congratulations h2 {
            font-size: 27px;
            font-weight: 800;
            color: #00843d;
            margin-bottom: 10px;
        }

        .client-name {
            font-size: 21px;
            font-weight: 700;
            color: #111;
            margin-bottom: 8px;
        }

        .message {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
        }

        /* Section */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #00843d;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #00843d;
        }

        /* Fund options */
        .fund-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #d5dcd7;
            border-radius: 8px;
            padding: 17px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .fund-option:hover {
            border-color: #00843d;
            background: #f7faf8;
        }

        .fund-option input {
            width: 18px;
            height: 18px;
            accent-color: #00843d;
        }

        .amount {
            font-size: 17px;
            font-weight: 700;
        }

        /* Button */
        .continue-btn {
            width: 100%;
            height: 52px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #00843d;
            color: #fff;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .continue-btn:hover {
            background: #006b31;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .funds-card {
                padding: 25px 20px;
            }

            .congratulations h2 {
                font-size: 24px;
            }

            .client-name {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>NYOTA FUNDS KENYA</h1>
    </header>

    <main class="container">

        <div class="funds-card">

            <div class="congratulations">
                <h2>Congratulations!</h2>

                <div class="client-name" id="clientName">
                    Applicant
                </div>

                <p class="message">
                    Your application has been received successfully.
                </p>
            </div>

            <div class="section-title">
                Select Fund Amount
            </div>

            <form id="fundForm">

                <label class="fund-option">
                    <span class="amount">KSh 22,000</span>
                    <input type="radio" name="amount" value="22000
