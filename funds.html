<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS KENYA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
    

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#0B0217;
    color:#fff;
    font-family:'Poppins',sans-serif;
    min-height:100vh;
}

.container{
    max-width:500px;
    margin:auto;
    height:100vh;
    padding:10px 16px;
    display:flex;
    flex-direction:column;
} 

h1{
    text-align:center;
    color:#D4AF37;
    font-size:36px;
    font-weight:700;
    margin-bottom:12px;
}

.message{
    text-align:center;
    font-size:27px;
    font-weight:400;
    line-height:1.35;
    margin-bottom:14px;
    color:rgba(255,255,255,0.72);
}

.message b{
    color:#D4AF37;
    font-weight:700;
}

h2{
    text-align:center;
    color:#D4AF37;
    font-size:27px;
    font-weight:700;
    margin-bottom:12px;
}

.amount-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.amount-btn{
    background:rgba(212,175,55,0.055);
    color:#fff;
    border:1px solid rgba(212,175,55,0.25);
    border-radius:15px;
    padding:14px 10px;
    font-size:27px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.amount-btn:hover{
    border-color:#D4AF37;
}

.amount-btn.selected{
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border-color:#D4AF37;
}

#feeDisplay{
    margin:12px 0;
    text-align:center;
    font-size:24px;
    font-weight:400;
    min-height:30px;
    color:rgba(255,255,255,0.85);
}

#feeDisplay span{
    font-size:27px;
    font-weight:700;
    color:#D4AF37;
}

.continue-btn{
    margin-top:0px;
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,#D4AF37,#A67C00);
    color:#0B0217;
    border:none;
    border-radius:15px;
    font-size:27px;
    font-weight:700;
    cursor:pointer;
}

.continue-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

@media(max-height:800px){

    .container{
        padding:8px 14px;
    }

   h1{
    font-size:30px;
    margin-bottom:8px;
}

.message{
    font-size:19px;
    line-height:1.25;
    margin-bottom:10px;
}

h2{
    font-size:21px;
    margin-bottom:10px;
}

.amount-grid{
    gap:8px;
}

.amount-btn{
    padding:11px 8px;
    font-size:20px;
}

#feeDisplay{
    margin:8px 0;
    min-height:26px;
    font-size:18px;
}

#feeDisplay span{
    font-size:20px;
}

.continue-btn{
    margin-top:0;
    padding:12px;
    font-size:20px;
}
        

</style>

</head>

<body>

<div class="container">

<h1>NYOTA FUNDS KENYA</h1>

<div class="message">

Congratulations 🎉 <span id="applicantName"></span><br><br>

You're eligible for <b>NYOTA Funds Limits.</b><br>

Kindly choose the amount you want and pay the
<b>program processing fee</b> to continue.

</div>

<h2>Select Your NYOTA FUNDS AMOUNT</h2>

<div class="amount-grid">

<button class="amount-btn"
onclick="selectAmount(22000,this)">
Ksh 22,000
</button>

<button class="amount-btn"
onclick="selectAmount(30000,this)">
Ksh 30,000
</button>

<button class="amount-btn"
onclick="selectAmount(40000,this)">
Ksh 40,000
</button>

<button class="amount-btn"
onclick="selectAmount(50000,this)">
Ksh 50,000
</button>

<button class="amount-btn"
onclick="selectAmount(65000,this)">
Ksh 65,000
</button>

<button class="amount-btn"
onclick="selectAmount(75000,this)">
Ksh 75,000
</button>

<button class="amount-btn"
onclick="selectAmount(85000,this)">
Ksh 85,000
</button>

<button class="amount-btn"
onclick="selectAmount(110000,this)">
Ksh 110,000
</button>

<button class="amount-btn"
onclick="selectAmount(150000,this)">
Ksh 150,000
</button>

</div>

<div id="feeDisplay">
Select an amount to see the processing fee.
</div>

<button
class="continue-btn"
onclick="continueNext()">

Continue

</button>

</div>

<script>

const fees = {

22000:350,
30000:400,
40000:460,
50000:520,
65000:660,
75000:780,
85000:910,
110000:1240,
150000:1500

};

let selectedAmount = null;

document.getElementById("applicantName").textContent =
localStorage.getItem("applicantName") || "Applicant";


function selectAmount(amount, btn){

selectedAmount = amount;

document
.querySelectorAll(".amount-btn")
.forEach(button=>{
    button.classList.remove("selected");
});

btn.classList.add("selected");

document.getElementById("feeDisplay").innerHTML =
"Processing Fee: <span>Ksh " +
fees[amount].toLocaleString() +
"</span>";

localStorage.setItem(
    "selectedAmount",
    amount
);

localStorage.setItem(
    "processingFee",
    fees[amount]
);

}


function continueNext(){

if(selectedAmount === null){

alert("Please select an amount first.");

return;

}

const button =
document.querySelector(".continue-btn");

button.textContent =
"Processing...";

button.disabled = true;

button.style.opacity = "0.7";

button.style.cursor =
"not-allowed";

setTimeout(() => {

window.location.href =
"payment.html";

},1000);

}

</script>

</body>
</html>
