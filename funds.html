<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYOTA Funds Kenya - Fund Selection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #111;
            min-height: 100vh;
        }

        .header {
            background: #00843d;
            padding: 22px 20px;
            text-align: center;
            border-bottom: 5px solid #111;
        }

        .header h1 {
            color: #fff;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .funds-card {
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .funds-card h2 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .fund-option {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid #d1d8d4;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: .2s ease;
        }

        .fund-option:hover {
            border-color: #00843d;
            background: #f8fbf9;
        }

        .fund-option.selected {
            border: 2px solid #00843d;
            background: #f0faf4;
        }

        .fund-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fund-left input {
            width: 19px;
            height: 19px;
            accent-color: #00843d;
        }

        .fund-amount {
            font-size: 18px;
            font-weight: 800;
        }

        .fee {
            text-align: right;
            font-size: 14px;
            color: #555;
        }

        .fee strong {
            display: block;
            color: #111;
            font-size: 15px;
            margin-top: 3px;
        }

        .continue-btn {
            width: 100%;
            height: 52px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #00843d;
            color: #fff;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .continue-btn:hover {
            background: #006b31;
        }

        .continue-btn:active {
            transform: scale(.99);
        }

        @media (max-width: 600px) {

            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .funds-card {
                padding: 25px 18px;
            }

            .funds-card h2 {
                font-size: 22px;
            }

            .fund-option {
                padding: 16px 14px;
            }

            .fund-amount {
                font-size: 16px;
            }

            .fee {
                font-size: 12px;
            }

            .fee strong {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>NYOTA FUNDS KENYA</h1>
</header>

<main class="container">

    <div class="funds-card">

        <h2>Select Fund Amount</h2>

        <p class="subtitle">
            Select your preferred fund amount to continue.
        </p>

        <form id="fundsForm">

            <label class="fund-option">
                <div class="fund-left">
                    <input type="radio"
                           name="fundAmount"
                           value="22000"
                           data-fee="350"
                           required>
                    <span class="fund-amount">KSh 22,000</span>
                </div>

                <div class="fee">
                    Processing Fee
                    <strong>KSh 350</strong>
                </div>
            </label>


            <label class="fund-option">
                <div class="fund-left">
                    <input type="radio"
                           name="fundAmount"
                           value="30000"
                           data-fee="400">
                    <span class="fund-amount">KSh 30,000</span>
                </div>

                <div class="fee">
                    Processing Fee
                    <strong>KSh 400</strong>
                </div>
            </label>


            <label class="fund-option">
                <div class="fund-left">
                    <input type="radio"
                           name="fundAmount"
                           value="40000"
                           data-fee="550">
                    <span class="fund-amount">KSh 40,000</span>
                </div>

                <div class="fee">
                    Processing Fee
                    <strong>KSh 550</strong>
                </div>
            </label>


            <label class="fund-option">
                <div class="fund-left">
                    <input type="radio"
                           name="fundAmount"
                           value="50000"
                           data-fee="600">
                    <span class="fund-amount">KSh 50,000</span>
                </div>

                <div class="fee">
                    Processing Fee
                    <strong>KSh 600</strong>
                </div>
            </label>


            <label class="fund-option">
                <div class="fund-left">
                    <input type="radio"
                           name="fundAmount"
                           value="80000"
                           data-fee="750">
                    <span class="fund-amount">KSh 80,000</span>
                </div>

                <div class="fee">
                    Processing Fee
                    <strong>KSh 750</strong>
                </div>
            </label>


            <label class="fund-option">
                <div class="fund-left">
                    <input type="radio"
                           name="fundAmount"
                           value="90000"
                           data-fee="850">
                    <span class="fund-amount">KSh 90,000</span>
                </div>

                <div class="fee">
                    Processing Fee
                    <strong>KSh 850</strong>
                </div>
            </label>


            <label class="fund-option">
                <div class="fund-left">
                    <input type="radio"
                           name="fundAmount"
                           value="100000"
                           data-fee="900">
                    <span class="fund-amount">KSh 100,000</span>
                </div>

                <div class="fee">
                    Processing Fee
                    <strong>KSh 900</strong>
                </div>
            </label>


            <label class="fund-option">
                <div class="fund-left">
                    <input type="radio"
                           name="fundAmount"
                           value="150000"
                           data-fee="1500">
                    <span class="fund-amount">KSh 150,000</span>
                </div>

                <div class="fee">
                    Processing Fee
                    <strong>KSh 1,500</strong>
                </div>
            </label>


            <button type="submit" class="continue-btn">
                CONTINUE
            </button>

        </form>

    </div>

</main>

<script>

    const options = document.querySelectorAll(".fund-option");

    options.forEach(option => {

        option.addEventListener("click", function() {

            options.forEach(item => {
                item.classList.remove("selected");
            });

            this.classList.add("selected");

            const radio = this.querySelector("input");

            radio.checked = true;
        });

    });


    document.getElementById("fundsForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const selected = document.querySelector(
            'input[name="fundAmount"]:checked'
        );

        if (!selected) {
            alert("Please select a fund amount.");
            return;
        }

        const fundAmount = selected.value;
        const processingFee = selected.dataset.fee;

        localStorage.setItem(
            "nyotaFundAmount",
            fundAmount
        );

        localStorage.setItem(
            "nyotaProcessingFee",
            processingFee
        );

        window.location.href = "confirmation.html";

    });

</script>

</body>
</html>
