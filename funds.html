<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYOTA Funds - Demo Fund Selection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #111;
            min-height: 100vh;
        }

        .header {
            background: #00843d;
            padding: 22px 20px;
            text-align: center;
            border-bottom: 5px solid #111;
        }

        .header h1 {
            color: #fff;
            font-size: 25px;
            font-weight: 800;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .demo-notice {
            background: #f1f1f1;
            border-left: 4px solid #111;
            padding: 12px 14px;
            margin-bottom: 25px;
            font-size: 13px;
            line-height: 1.5;
        }

        h2 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
            font-size: 15px;
        }

        .amount-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #d0d6d2;
            border-radius: 8px;
            padding: 17px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: .2s;
        }

        .amount-option:hover {
            border-color: #00843d;
        }

        .amount-option.selected {
            border: 2px solid #00843d;
            background: #f1faf5;
        }

        .amount-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .amount-left input {
            width: 19px;
            height: 19px;
            accent-color: #00843d;
        }

        .amount {
            font-size: 18px;
            font-weight: 800;
        }

        .continue-btn {
            width: 100%;
            height: 52px;
            margin-top: 18px;
            border: none;
            border-radius: 7px;
            background: #00843d;
            color: #fff;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .continue-btn:hover {
            background: #006b31;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .card {
                padding: 25px 20px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>NYOTA FUNDS KENYA</h1>
</header>

<main class="container">

    <div class="card">

        <div class="demo-notice">
            <strong>DEMO PAGE:</strong>
            This page is for website testing and demonstration purposes.
        </div>

        <h2>Select Fund Amount</h2>

        <p class="subtitle">
            Choose one amount to continue.
        </p>

        <form id="fundsForm">

            <label class="amount-option">
                <div class="amount-left">
                    <input type="radio" name="fundAmount" value="22000" required>
                    <span class="amount">KSh 22,000</span>
                </div>
            </label>

            <label class="amount-option">
                <div class="amount-left">
                    <input type="radio" name="fundAmount" value="30000">
                    <span class="amount">KSh 30,000</span>
                </div>
            </label>

            <label class="amount-option">
                <div class="amount-left">
                    <input type="radio" name="fundAmount" value="40000">
                    <span class="amount">KSh 40,000</span>
                </div>
            </label>

            <label class="amount-option">
                <div class="amount-left">
                    <input type="radio" name="fundAmount" value="50000">
                    <span class="amount">KSh 50,000</span>
                </div>
            </label>

            <label class="amount-option">
                <div class="amount-left">
                    <input type="radio" name="fundAmount" value="80000">
                    <span class="amount">KSh 80,000</span>
                </div>
            </label>

            <label class="amount-option">
                <div class="amount-left">
                    <input type="radio" name="fundAmount" value="90000">
                    <span class="amount">KSh 90,000</span>
                </div>
            </label>

            <label class="amount-option">
                <div class="amount-left">
                    <input type="radio" name="fundAmount" value="100000">
                    <span class="amount">KSh 100,000</span>
                </div>
            </label>

            <label class="amount-option">
                <div class="amount-left">
                    <input type="radio" name="fundAmount" value="150000">
                    <span class="amount">KSh 150,000</span>
                </div>
            </label>

            <button type="submit" class="continue-btn">
                CONTINUE
            </button>

        </form>

    </div>

</main>

<script>
    const options = document.querySelectorAll(".amount-option");

    options.forEach(option => {
        option.addEventListener("click", function () {

            options.forEach(item => {
                item.classList.remove("selected");
            });

            this.classList.add("selected");

            const radio = this.querySelector("input");
            radio.checked = true;
        });
    });

    document.getElementById("fundsForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const selected = document.querySelector(
            'input[name="fundAmount"]:checked'
        );

        if (!selected) {
            alert("Please select an amount.");
            return;
        }

        localStorage.setItem("nyotaFundAmount", selected.value);

        window.location.href = "confirmation.html";
    });
</script>

</body>
</html>
