<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Funds Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #111;
        }

        .funds-page {
            min-height: 100vh;
            padding: 35px 20px;
        }

        .funds-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .funds-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .funds-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .funds-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .funds-header p {
            color: #666;
            font-size: 15px;
        }

        .amount-list {
            display: grid;
            gap: 14px;
        }

        .amount-option {
            display: block;
            cursor: pointer;
        }

        .amount-option input {
            display: none;
        }

        .amount-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #fff;
            transition: 0.2s;
        }

        .amount-option input:checked + .amount-box {
            border-color: #16823a;
            background: #eef8f1;
        }

        .amount {
            font-size: 19px;
            font-weight: 800;
        }

        .fee {
            font-size: 14px;
            color: #666;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #16823a;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #11672e;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="funds-page">

    <div class="funds-container">

        <div class="funds-card">

            <div class="funds-header">
                <h1>Select Your Fund Amount</h1>
                <p>Choose the amount you would like to apply for.</p>
            </div>

            <form id="applicationForm">

                <div class="amount-list">

                    <label class="amount-option">
                        <input type="radio" name="fundAmount" value="22000">
                        <div class="amount-box">
                            <span class="amount">KSh 22,000</span>
                            <span class="fee">Fee: KSh 350</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="fundAmount" value="30000">
                        <div class="amount-box">
                            <span class="amount">KSh 30,000</span>
                            <span class="fee">Fee: KSh 400</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="fundAmount" value="40000">
                        <div class="amount-box">
                            <span class="amount">KSh 40,000</span>
                            <span class="fee">Fee: KSh 450</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="fundAmount" value="50000">
                        <div class="amount-box">
                            <span class="amount">KSh 50,000</span>
                            <span class="fee">Fee: KSh 500</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="fundAmount" value="80000">
                        <div class="amount-box">
                            <span class="amount">KSh 80,000</span>
                            <span class="fee">Fee: KSh 550</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="fundAmount" value="90000">
                        <div class="amount-box">
                            <span class="amount">KSh 90,000</span>
                            <span class="fee">Fee: KSh 600</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="fundAmount" value="100000">
                        <div class="amount-box">
                            <span class="amount">KSh 100,000</span>
                            <span class="fee">Fee: KSh 650</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="fundAmount" value="150000">
                        <div class="amount-box">
                            <span class="amount">KSh 150,000</span>
                            <span class="fee">Fee: KSh 890</span>
                        </div>
                    </label>

                </div>

                <button
                    type="submit"
                    id="submitApplication"
                    class="submit-btn">
                    Continue
                </button>

            </form>

        </div>

    </div>

</div>

<script src="funds.js" defer></script>

</body>
</html>
