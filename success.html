<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS - Success</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;

    font-family:Arial,sans-serif;

    background:#006400;

    color:#FFFFFF;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.card{
    width:100%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    padding:28px 18px 22px;

    border-radius:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    border:1px solid #000000;

    text-align:center;
}


/* ==========================================
   SUCCESS ICON
========================================== */

.success{
    width:78px;
    height:78px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#FFD400;

    color:#000000;

    border:2px solid #000000;

    border-radius:50%;

    font-size:42px;

    font-weight:800;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.30);
}


/* ==========================================
   HEADING
========================================== */

h1{
    background:#000000;

    color:#FFFFFF;

    font-size:25px;

    font-weight:800;

    margin:0 0 18px;

    padding:12px 8px;

    border:1px solid #FFFFFF;

    border-radius:10px;
}


/* ==========================================
   MESSAGE
========================================== */

.message{
    font-size:15px;

    line-height:1.7;

    color:#FFFFFF;

    margin-bottom:22px;
}

.highlight{
    color:#FFD400;

    font-weight:800;
}


/* ==========================================
   STATUS BOX
========================================== */

.status-box{
    background:#000000;

    border:1px solid #FFFFFF;

    border-radius:12px;

    padding:17px 12px;

    margin-top:18px;
}

.status-title{
    color:#FFFFFF;

    font-size:14px;

    margin-bottom:8px;
}

.status{
    color:#FFD400;

    font-size:19px;

    font-weight:800;
}


/* ==========================================
   MPESA NOTICE
========================================== */

.notice{
    margin-top:18px;

    padding:14px;

    background:
        rgba(255,212,0,0.12);

    border:1px solid #FFD400;

    border-radius:10px;

    color:#FFFFFF;

    font-size:13px;

    line-height:1.5;
}


/* ==========================================
   FOOTER
========================================== */

.footer{
    margin-top:18px;

    font-size:12px;

    color:#FFFFFF;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:22px 13px 18px;

        border-radius:15px;
    }

    .success{
        width:70px;
        height:70px;

        font-size:38px;
    }

    h1{
        font-size:23px;
    }

    .message{
        font-size:14px;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="card">


    <!-- SUCCESS ICON -->

    <div class="success">
        ✓
    </div>


    <!-- HEADING -->

    <h1>
        Congratulations 🎊
    </h1>


    <!-- MAIN MESSAGE -->

    <div class="message">

        You have successfully completed
        all the required steps.

        <br><br>

        Your fund will be available in your
        <span class="highlight">
            M-PESA
        </span>

        within the next
        <span class="highlight">
            3 hours
        </span>.

    </div>


    <!-- STATUS -->

    <div class="status-box">

        <div class="status-title">
            Application Status
        </div>

        <div class="status">
            COMPLETED ✓
        </div>

    </div>


    <!-- NOTICE -->

    <div class="notice">

        Please keep your M-PESA line active
        and accessible while your fund is
        being processed.

    </div>


    <!-- FOOTER -->

    <div class="footer">
        NYOTA FUNDS
    </div>


</div>

</div>


</body>

</html>
