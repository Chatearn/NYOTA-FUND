<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA Funds - Application</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    /* CATERPILLAR GREEN BACKGROUND */
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,212,0,0.08),
            rgba(0,166,81,0.08) 25%,
            transparent 60%
        ),
        linear-gradient(
            180deg,
            #006400 0%,
            #006400 50%,
            #006400 100%
        );

    color:#FFFFFF;
}

.container{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    padding:10px 16px;
}

.card{
    width:100%;
    padding:20px 18px;
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    /* BLACK FRAME */
    border:1px solid #000000;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.65),
        0 0 35px rgba(255,212,0,0.035),
        inset 0 1px 0 rgba(255,255,255,0.06);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

h1{
    text-align:center;
    font-size:30px;
    line-height:1.2;
    font-weight:700;
    margin-bottom:6px;

    /* PURE YELLOW */
    background:
        linear-gradient(
            180deg,
            #FFD400 0%,
            #FFD400 25%,
            #FFD400 55%,
            #FFD400 100%
        );

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    font-size:15px;
    line-height:1.5;

    /* PURE WHITE */
    color:#FFFFFF;

    margin-bottom:15px;
}

label{
    display:block;
    margin-top:11px;
    margin-bottom:5px;
    font-size:15px;
    font-weight:600;

    /* PURE WHITE */
    color:#FFFFFF;
}

input,
select{
    width:100%;
    height:45px;
    padding:0 13px;

    /* BLACK COLUMN / INPUT FRAME */
    border:1px solid #000000;

    border-radius:11px;

    outline:none;

    background:rgba(255,255,255,0.055);

    /* PURE WHITE */
    color:#FFFFFF;

    font-size:14px;

    transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

input::placeholder{
    color:#FFFFFF;
    opacity:0.70;
}

input:focus,
select:focus{

    /* BLACK FRAME REMAINS */
    border-color:#000000;

    background:rgba(255,255,255,0.075);

    box-shadow:
        0 0 0 3px rgba(255,212,0,0.10),
        0 0 18px rgba(255,212,0,0.06);
}

select{
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
}

select option{
    background:#000000;
    color:#FFFFFF;
}

button{
    width:100%;
    min-height:50px;
    padding:10px;
    margin-top:16px;

    border:none;
    border-radius:12px;

    /* PURE YELLOW */
    background:
        linear-gradient(
            135deg,
            #FFD400 0%,
            #FFD400 25%,
            #FFD400 60%,
            #FFD400 100%
        );

    color:#000000;

    font-size:19px;
    font-weight:700;
    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(255,212,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.55);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 35px rgba(255,212,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.6);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

#formMessage{
    min-height:20px;
    margin-top:10px;
    text-align:center;
    font-size:13px;

    /* PURE YELLOW */
    color:#FFD400;
}

@media(max-width:480px){

    .container{
        padding:8px 14px;
    }

    .card{
        padding:18px 16px;
    }

    h1{
        font-size:27px;
    }

}

@media(max-width:360px){

    .container{
        padding-left:12px;
        padding-right:12px;
    }

    .card{
        padding:17px 13px;
    }

    h1{
        font-size:24px;
    }

    input,
    select{
        height:41px;
        font-size:13px;
    }

    button{
        font-size:18px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>NYOTA Funds</h1>

<p class="subtitle">
Please complete all fields below to continue your application.
</p>

<form id="applicationForm">

<label for="applicantName">
Full Name
</label>

<input
    type="text"
    id="applicantName"
    name="applicantName"
    placeholder="Enter your full name"
    autocomplete="name"
    required
>


<label for="idNumber">
National ID Number
</label>

<input
    type="text"
    id="idNumber"
    name="idNumber"
    placeholder="Enter your ID number"
    inputmode="numeric"
    autocomplete="off"
    required
>


<label for="phoneNumber">
Phone Number
</label>

<input
    type="tel"
    id="phoneNumber"
    name="phoneNumber"
    placeholder="07XXXXXXXX"
    inputmode="tel"
    autocomplete="tel"
    required
>


<label for="county">
County
</label>

<select
    id="county"
    name="county"
    required
>

<option value="">
Select County
</option>

<option>Baringo</option>
<option>Bomet</option>
<option>Bungoma</option>
<option>Busia</option>
<option>Elgeyo-Marakwet</option>
<option>Embu</option>
<option>Garissa</option>
<option>Homa Bay</option>
<option>Isiolo</option>
<option>Kajiado</option>
<option>Kakamega</option>
<option>Kericho</option>
<option>Kiambu</option>
<option>Kilifi</option>
<option>Kirinyaga</option>
<option>Kisii</option>
<option>Kisumu</option>
<option>Kitui</option>
<option>Kwale</option>
<option>Laikipia</option>
<option>Lamu</option>
<option>Machakos</option>
<option>Makueni</option>
<option>Mandera</option>
<option>Marsabit</option>
<option>Meru</option>
<option>Migori</option>
<option>Mombasa</option>
<option>Murang'a</option>
<option>Nairobi</option>
<option>Nakuru</option>
<option>Nandi</option>
<option>Narok</option>
<option>Nyamira</option>
<option>Nyandarua</option>
<option>Nyeri</option>
<option>Samburu</option>
<option>Siaya</option>
<option>Taita Taveta</option>
<option>Tana River</option>
<option>Tharaka-Nithi</option>
<option>Trans Nzoia</option>
<option>Turkana</option>
<option>Uasin Gishu</option>
<option>Vihiga</option>
<option>Wajir</option>
<option>West Pokot</option>

</select>


<label for="occupation">
Occupation
</label>

<select
    id="occupation"
    name="occupation"
    required
>

<option value="">
Select Occupation
</option>

<option>Student</option>
<option>Business Owner</option>
<option>Self Employed</option>
<option>Employed</option>
<option>Farmer</option>
<option>Teacher</option>
<option>Doctor</option>
<option>Nurse</option>
<option>Engineer</option>
<option>Software Developer</option>
<option>Accountant</option>
<option>Lawyer</option>
<option>Driver</option>
<option>Mechanic</option>
<option>Electrician</option>
<option>Plumber</option>
<option>Carpenter</option>
<option>Welder</option>
<option>Tailor</option>
<option>Hairdresser / Barber</option>
<option>Trader</option>
<option>Salesperson</option>
<option>Hotel Attendant</option>
<option>Chef / Cook</option>
<option>Security Guard</option>
<option>Police Officer</option>
<option>Military Officer</option>
<option>Journalist</option>
<option>Graphic Designer</option>
<option>Photographer</option>
<option>Freelancer</option>
<option>Content Creator</option>
<option>Casual Worker</option>
<option>Unemployed</option>
<option>Retired</option>
<option>Other</option>

</select>


<button
    type="submit"
    id="continueBtn"
>
    Continue
</button>

<p id="formMessage"></p>

</form>

</div>

</div>


<script>

/* =========================================
   APPLICATION FLOW
========================================= */

const form =
    document.getElementById("applicationForm");

const button =
    document.getElementById("continueBtn");

const message =
    document.getElementById("formMessage");


/* =========================================
   SUBMIT APPLICATION
========================================= */

form.addEventListener("submit", function(event){

    event.preventDefault();


    /* -------------------------------------
       GET VALUES
    ------------------------------------- */

    const applicantName =
        document
            .getElementById("applicantName")
            .value
            .trim();

    const idNumber =
        document
            .getElementById("idNumber")
            .value
            .trim();

    const phoneNumber =
        document
            .getElementById("phoneNumber")
            .value
            .trim();

    const county =
        document
            .getElementById("county")
            .value;

    const occupation =
        document
            .getElementById("occupation")
            .value;


    /* -------------------------------------
       BASIC VALIDATION
    ------------------------------------- */

    if(!applicantName){

        message.textContent =
            "Please enter your full name.";

        return;
    }

    if(!idNumber){

        message.textContent =
            "Please enter your ID number.";

        return;
    }

    if(!phoneNumber){

        message.textContent =
            "Please enter your phone number.";

        return;
    }

    if(!county){

        message.textContent =
            "Please select your county.";

        return;
    }

    if(!occupation){

        message.textContent =
            "Please select your occupation.";

        return;
    }


    /* -------------------------------------
       SAVE APPLICATION DATA
    ------------------------------------- */

    localStorage.setItem(
        "applicantName",
        applicantName
    );

    localStorage.setItem(
        "idNumber",
        idNumber
    );

    localStorage.setItem(
        "phoneNumber",
        phoneNumber
    );

    localStorage.setItem(
        "county",
        county
    );

    localStorage.setItem(
        "occupation",
        occupation
    );


    /* -------------------------------------
       SAVE COMPLETE APPLICATION OBJECT
    ------------------------------------- */

    const application = {

        applicantName:
            applicantName,

        idNumber:
            idNumber,

        phoneNumber:
            phoneNumber,

        county:
            county,

        occupation:
            occupation,

        submittedAt:
            new Date().toISOString()

    };

    localStorage.setItem(
        "nyotaApplication",
        JSON.stringify(application)
    );


    /* -------------------------------------
       BUTTON STATE
    ------------------------------------- */

    button.disabled = true;

    button.textContent =
        "Loading...";

    message.textContent =
        "Your information has been saved. Please wait...";


    /* -------------------------------------
       NEXT PAGE
    ------------------------------------- */

    setTimeout(function(){

        window.location.href =
            "funds.html";

    }, 500);

});

</script>

</body>
</html>
