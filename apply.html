<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA Funds - Application</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    /* DARK GREEN BACKGROUND */
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,212,0,0.08),
            rgba(0,100,0,0.08) 25%,
            transparent 60%
        ),
        linear-gradient(
            180deg,
            #006400 0%,
            #006400 50%,
            #006400 100%
        );

    color:#FFFFFF;
}

.container{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    padding:10px 16px;
}

.card{
    width:100%;
    padding:20px 18px;
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    /* BLACK FRAME */
    border:1px solid #000000;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.65),
        0 0 35px rgba(255,212,0,0.035),
        inset 0 1px 0 rgba(255,255,255,0.06);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

h1{
    text-align:center;
    font-size:30px;
    line-height:1.2;
    font-weight:700;
    margin-bottom:6px;

    /* PURE YELLOW */
    background:
        linear-gradient(
            180deg,
            #FFD400 0%,
            #FFD400 25%,
            #FFD400 55%,
            #FFD400 100%
        );

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    font-size:15px;
    line-height:1.5;

    /* PURE WHITE */
    color:#FFFFFF;

    margin-bottom:15px;
}

label{
    display:block;
    margin-top:11px;
    margin-bottom:5px;
    font-size:15px;
    font-weight:600;

    /* PURE WHITE */
    color:#FFFFFF;
}

input,
select{
    width:100%;
    height:45px;
    padding:0 13px;

    /* BLACK COLUMN / INPUT FRAME */
    border:1px solid #000000;

    border-radius:11px;

    outline:none;

    background:rgba(255,255,255,0.055);

    /* PURE WHITE */
    color:#FFFFFF;

    font-size:14px;

    transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

input::placeholder{
    color:#FFFFFF;
    opacity:0.70;
}

input:focus,
select:focus{

    /* BLACK FRAME REMAINS */
    border-color:#000000;

    background:rgba(255,255,255,0.075);

    box-shadow:
        0 0 0 3px rgba(255,212,0,0.10),
        0 0 18px rgba(255,212,0,0.06);
}

select{
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
}

select option{
    background:#000000;
    color:#FFFFFF;
}

button{
    width:100%;
    min-height:50px;
    padding:10px;
    margin-top:16px;

    border:none;
    border-radius:12px;

    /* PURE YELLOW */
    background:
        linear-gradient(
            135deg,
            #FFD400 0%,
            #FFD400 25%,
            #FFD400 60%,
            #FFD400 100%
        );

    color:#000000;

    font-size:19px;
    font-weight:700;
    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(255,212,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.55);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 35px rgba(255,212,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.6);
}

button:active{
