<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;
    font-family:Arial,sans-serif;
    background:#0B0217;
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.card{
    width:100%;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    padding:22px 18px 18px;
    border-radius:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.10);
}

h1{
    text-align:center;
    color:#fff;
    font-size:22px;
    font-weight:700;
    margin:2px 0 16px;
}

p{
    text-align:center;
    font-size:14px;
    line-height:1.5;
    color:rgba(255,255,255,0.72);
}

.amount{
    background:rgba(155,53,255,0.08);
    border:1px solid rgba(155,53,255,0.18);
    border-radius:12px;
    padding:14px 10px;
    font-size:20px;
    font-weight:700;
    text-align:center;
    color:#fff;
    margin:18px 0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-size:14px;
    font-weight:700;
    color:rgba(255,255,255,0.88);
}

input{
    width:100%;
    padding:14px 12px;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    font-size:16px;
    background:rgba(255,255,255,0.07);
    color:#fff;
    outline:none;
}

input:focus{
    border-color:rgba(169,72,255,0.8);
    box-shadow:0 0 0 3px rgba(155,55,255,0.12);
}

button{
    width:100%;
    padding:15px;
    margin-top:17px;

    background:
        linear-gradient(
            135deg,
            #9B35FF,
            #6C1DCE
        );

    color:white;
    border:none;
    border-radius:11px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(137,43,226,0.30);
}

button:hover{
    background:
        linear-gradient(
            135deg,
            #A844FF,
            #7625DC
        );
}

button:active{
    transform:scale(.98);
}

button:disabled{
    background:rgba(255,255,255,0.25);
    cursor:not-allowed;
    box-shadow:none;
}

#stkMessage{
    min-height:20px;
    margin-top:13px;
    color:#B86CFF;
    font-size:13px;
    font-weight:600;
    line-height:1.5;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:18px 13px 15px;
        border-radius:15px;
    }

    h1{
        font-size:20px;
    }

    button{
        padding:14px;
        font-size:15px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Processing Fee</h1>

<p>
Welcome, <strong><span id="name"></span></strong>
</p>

<p>
To continue with your NYOTA Fund application,
please complete the processing fee payment below.
</p>

<div class="amount" id="feeAmount">
Processing Fee: KSh 350
</div>

<label>
Full Name
</label>

<input
    type="text"
    id="fullName"
    readonly
>

<label>
M-PESA Phone Number
</label>

<input
    type="tel"
    id="phone"
    placeholder="2547XXXXXXXX"
>

<button
    id="payBtn"
    onclick="payNow()"
>
    Pay Processing Fee
</button>

<p id="stkMessage"></p>

</div>

</div>

<script>

/*
====================================================
APPLICANT INFORMATION
====================================================
*/

let applicant =
    localStorage.getItem("applicantName");

document.getElementById("name").innerHTML =
    applicant || "Applicant";

document.getElementById("fullName").value =
    applicant || "";


/*
====================================================
PROCESSING FEE
====================================================
*/

let processingFee =
    localStorage.getItem("processingFee") || "350";

document.getElementById("feeAmount").innerHTML =
    "Processing Fee: KSh " +
    Number(processingFee).toLocaleString();


/*
====================================================
STK PUSH
====================================================
*/

async function payNow(){

    let phone =
        document
            .getElementById("phone")
            .value
            .trim();

    let btn =
        document.getElementById("payBtn");

    /*
    SAVE CUSTOMER DETAILS
    */

    localStorage.setItem(
        "phoneNumber",
        phone
    );

    localStorage.setItem(
        "fullName",
        document
            .getElementById("fullName")
            .value
    );


    /*
    CHECK PHONE
    */

    if(phone === ""){

        alert(
            "Please enter your M-PESA phone number."
        );

        return;
    }


    /*
    BUTTON
    */

    btn.innerHTML =
        "Sending STK Push...";

    btn.disabled = true;


    try{

        /*
        ====================================================
        BACKEND STK ENDPOINT
        ====================================================
        */

        let response =
            await fetch(
                "https://nyota-backed1.onrender.com/api/payment/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            phone:phone,

                            amount:
                                Number(
                                    processingFee
                                )

                        })
                }
            );


        /*
        ====================================================
        READ RESPONSE
        ====================================================
        */

        let data =
            await response
                .json()
                .catch(() => ({}));


        console.log(
            "STK RESPONSE:",
            data
        );


        /*
        ====================================================
        CHECK RESPONSE
        ====================================================
        */

        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(

                data.error ||
                data.message ||
                "STK Push failed"

            );

        }


        /*
        ====================================================
        TRANSACTION ID
        ====================================================
        */

        let transactionId =
            data.transactionId ||
            data.checkout_request_id;


        if(!transactionId){

            throw new Error(
                "No Paylor transaction ID received"
            );

        }


        /*
        ====================================================
        SUCCESS MESSAGE
        ====================================================
        */

        btn.innerHTML =
            "Processing...";


        document.getElementById(
            "stkMessage"
        ).innerHTML =

            "An M-PESA payment request has been sent to your phone. Please enter your M-PESA PIN to complete the payment.";


        /*
        ====================================================
        SAVE TRANSACTION ID
        ====================================================
        */

        localStorage.setItem(
            "transactionId",
            transactionId
        );


        /*
        ====================================================
        START PAYMENT CHECK
        ====================================================
        */

        checkPayment(
            transactionId
        );


    }catch(error){

        console.log(
            "PAYMENT ERROR:",
            error
        );


        alert(
            error.message ||
            "Payment request failed."
        );


        btn.innerHTML =
            "Pay Processing Fee";

        btn.disabled = false;

    }

}


/*
====================================================
PAYMENT STATUS
====================================================
*/
async function checkPayment(reference){

    const btn =
        document.getElementById("payBtn");

    const message =
        document.getElementById("stkMessage");

    let attempts = 0;
    const maxAttempts = 100;

    message.innerHTML =
        "M-PESA payment sent. Waiting for confirmation...";

    window.paymentChecker = setInterval(async () => {

        attempts++;

        try {

            const response = await fetch(
                "https://https://nyota-backed1.onrender.com/api/payment/status?reference=" +
                encodeURIComponent(reference),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

            const data = await response.json();

            console.log(
                "PAYMENT STATUS:",
                data
            );

            /*
            PAYMENT SUCCESSFUL
            */

            if (
                data.status === "COMPLETED" ||
                data.status === "SUCCESS"
            ) {

                clearInterval(
                    window.paymentChecker
                );

                message.innerHTML =
                    "Payment successful. Redirecting...";

                btn.innerHTML =
                    "Payment Successful";

                localStorage.setItem(
                    "paymentStatus",
                    "COMPLETED"
                );

                if (data.transactionId) {

                    localStorage.setItem(
                        "transactionId",
                        data.transactionId
                    );

                }

                if (data.mpesaReceipt) {

                    localStorage.setItem(
                        "mpesaReceipt",
                        data.mpesaReceipt
                    );

                }

                /*
                REDIRECT TO DELIVERY
                */

                window.location.replace(
                    "delivery.html"
                );

                return;
            }

            /*
            PAYMENT FAILED
            */

            if (data.status === "FAILED") {

                clearInterval(
                    window.paymentChecker
                );

                message.innerHTML =
                    "Payment failed. Please try again.";

                btn.innerHTML =
                    "Pay Processing Fee";

                btn.disabled = false;

                return;
            }

            /*
            TIMEOUT
            */

            if (attempts >= maxAttempts) {

                clearInterval(
                    window.paymentChecker
                );

                message.innerHTML =
                    "Payment confirmation is taking longer than expected.";

                btn.innerHTML =
                    "Pay Processing Fee";

                btn.disabled = false;
            }

        } catch (error) {

            console.error(
                "PAYMENT STATUS ERROR:",
                error
            );

        }

    }, 3000);

}


</script>

</body>

</html>
