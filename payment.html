<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYOTA Funds - Payment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="payment-page">

        <div class="payment-card">

            <h1>Application Summary</h1>

            <p class="subtitle">
                Please review your selected fund amount.
            </p>

            <div class="amount-box">
                <span>Selected Amount</span>
                <strong id="selectedAmount">Loading...</strong>
            </div>

            <div class="notice">
                <p>
                    Your application has been received.
                    Review the information above before continuing.
                </p>
            </div>

            <button
                type="button"
                class="continue-btn"
                id="continueButton"
                onclick="continueApplication()">
                CONTINUE
            </button>

            <button
                type="button"
                class="back-btn"
                onclick="history.back()">
                BACK
            </button>

            <p id="statusMessage"></p>

        </div>

    </div>

    <script>

        /* ================================
           BACKEND
        ================================= */

        const BACKEND_URL =
            "https://YOUR-RENDER-URL";

        /* ================================
           SELECTED AMOUNT
        ================================= */

        const selectedAmount =
            localStorage.getItem("selectedAmount");

        const amountElement =
            document.getElementById("selectedAmount");

        const statusMessage =
            document.getElementById("statusMessage");

        const continueButton =
            document.getElementById("continueButton");

        if (selectedAmount) {

            amountElement.textContent =
                "KSh " + Number(selectedAmount).toLocaleString();

        } else {

            amountElement.textContent =
                "No amount selected";
        }

        /* ================================
           CONTINUE
        ================================= */

        async function continueApplication() {

            if (!selectedAmount) {

                alert("Please select a fund amount first.");

                window.location.href =
                    "funds.html";

                return;
            }

            continueButton.disabled = true;
            continueButton.textContent = "PROCESSING...";

            statusMessage.textContent =
                "Connecting to the payment server...";

            try {

                /*
                 * Test phone number.
                 * We will replace this with the
                 * applicant phone from localStorage
                 * after the connection is confirmed.
                 */

                const phone =
                    localStorage.getItem("phone") ||
                    "254700000000";

                const response = await fetch(
                    BACKEND_URL + "/api/test-stk",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            phone: phone,
                            amount: Number(selectedAmount)
                        })
                    }
                );

                const data =
                    await response.json();

                console.log("Backend response:", data);

                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Payment server rejected the request."
                    );
                }

                statusMessage.textContent =
                    "Test STK request was accepted successfully.";

                continueButton.textContent =
                    "REQUEST SENT";

            } catch (error) {

                console.error(error);

                statusMessage.textContent =
                    "Unable to connect to the payment server.";

                continueButton.disabled = false;

                continueButton.textContent =
                    "TRY AGAIN";
            }
        }

    </script>

</body>
</html>
