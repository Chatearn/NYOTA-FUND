<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;
    font-family:Arial,sans-serif;
    background:#0B0217;
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.card{
    width:100%;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    padding:22px 18px 18px;
    border-radius:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.10);
}

h1{
    text-align:center;
    color:#fff;
    font-size:22px;
    font-weight:700;
    margin:2px 0 16px;
}

p{
    text-align:center;
    font-size:14px;
    line-height:1.5;
    color:rgba(255,255,255,0.72);
}

.amount{
    background:rgba(155,53,255,0.08);
    border:1px solid rgba(155,53,255,0.18);
    border-radius:12px;
    padding:14px 10px;
    font-size:20px;
    font-weight:700;
    text-align:center;
    color:#fff;
    margin:18px 0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-size:14px;
    font-weight:700;
    color:rgba(255,255,255,0.88);
}

input{
    width:100%;
    padding:14px 12px;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    font-size:16px;
    background:rgba(255,255,255,0.07);
    color:#fff;
    outline:none;
}

input::placeholder{
    color:rgba(255,255,255,0.45);
}

input:focus{
    border-color:rgba(169,72,255,0.8);
    box-shadow:0 0 0 3px rgba(155,55,255,0.12);
}

button{
    width:100%;
    padding:15px;
    margin-top:17px;

    background:
        linear-gradient(
            135deg,
            #9B35FF,
            #6C1DCE
        );

    color:white;
    border:none;
    border-radius:11px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(137,43,226,0.30);
}

button:hover{
    background:
        linear-gradient(
            135deg,
            #A844FF,
            #7625DC
        );
}

button:active{
    transform:scale(.98);
}

button:disabled{
    background:rgba(255,255,255,0.25);
    cursor:not-allowed;
    box-shadow:none;
}

#stkMessage{
    min-height:20px;
    margin-top:13px;
    color:#B86CFF;
    font-size:13px;
    font-weight:600;
    line-height:1.5;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:18px 13px 15px;
        border-radius:15px;
    }

    h1{
        font-size:20px;
    }

    button{
        padding:14px;
        font-size:15px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Processing Fee</h1>

<p>
Welcome, <strong><span id="name"></span></strong>
</p>

<p>
To continue with your NYOTA Fund application,
please complete the processing fee payment below.
</p>

<div class="amount" id="feeAmount">
Processing Fee: KSh 350
</div>

<label>
Full Name
</label>

<input
    type="text"
    id="fullName"
    readonly
>

<label>
M-PESA Phone Number
</label>

<input
    type="tel"
    id="phone"
    placeholder="2547XXXXXXXX"
    autocomplete="tel"
>

<button
    type="button"
    id="payBtn"
    onclick="payNow()"
>
    Pay Processing Fee
</button>

<p id="stkMessage"></p>

</div>

</div>


<script>

/*
====================================================
NYOTA FUNDS PAYMENT
====================================================

Backend:
https://nyota-backed1.onrender.com

STK:
POST /api/payment/stk-push

STATUS:
GET /api/payment/status?reference=...

CALLBACK:
POST /paylor-callback
====================================================
*/


/*
====================================================
APPLICANT INFORMATION
====================================================
*/

const applicant =
    localStorage.getItem("applicantName");

document.getElementById("name").textContent =
    applicant || "Applicant";

document.getElementById("fullName").value =
    applicant || "";


/*
====================================================
PROCESSING FEE
====================================================
*/

const processingFee =
    localStorage.getItem("processingFee") || "350";

const numericProcessingFee =
    Number(processingFee);

document.getElementById("feeAmount").textContent =
    "Processing Fee: KSh " +
    numericProcessingFee.toLocaleString();


/*
====================================================
PAYMENT BUTTON
====================================================
*/

async function payNow(){

    const phoneInput =
        document.getElementById("phone");

    const btn =
        document.getElementById("payBtn");

    const message =
        document.getElementById("stkMessage");


    const phone =
        phoneInput.value.trim();


    /*
    ================================================
    VALIDATE PHONE
    ================================================
    */

    if(phone === ""){

        message.textContent =
            "Please enter your M-PESA phone number.";

        phoneInput.focus();

        return;
    }


    /*
    Accept:
    0712345678
    0112345678
    254712345678
    +254712345678
    */

    const cleanedPhone =
        phone
            .replace(/\s+/g,"")
            .replace(/-/g,"");


    const validPhone =
        /^(\+254|254|07|01)\d{8,9}$/
            .test(cleanedPhone);


    if(!validPhone){

        message.textContent =
            "Please enter a valid Kenyan M-PESA phone number.";

        phoneInput.focus();

        return;
    }


    /*
    ================================================
    SAVE CUSTOMER DETAILS
    ================================================
    */

    localStorage.setItem(
        "phoneNumber",
        phone
    );

    localStorage.setItem(
        "fullName",
        document
            .getElementById("fullName")
            .value
    );


    /*
    ================================================
    DISABLE BUTTON
    ================================================
    */

    btn.disabled = true;

    btn.textContent =
        "Sending STK Push...";

    message.textContent =
        "Please wait while we send the M-PESA payment request...";


    try{

        /*
        ================================================
        SEND STK PUSH
        ================================================
        */

        const response =
            await fetch(
                "https://nyota-backed1.onrender.com/api/payment/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            phone:
                                phone,

                            amount:
                                numericProcessingFee,

                            description:
                                "Nyota processing fee"

                        })
                }
            );


        /*
        ================================================
        READ SERVER RESPONSE
        ================================================
        */

        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        console.log(
            "NYOTA STK RESPONSE:",
            data
        );


        /*
        ================================================
        CHECK RESPONSE
        ================================================
        */

        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(

                data.error ||
                data.message ||
                "STK Push failed."

            );

        }


        /*
        ================================================
        PAYMENT REFERENCE
        ================================================
        */

        const reference =
            data.reference;


        if(!reference){

            throw new Error(
                "The payment reference was not returned by the server."
            );

        }


        /*
        ================================================
        TRANSACTION ID
        ================================================
        */

        const transactionId =
            data.transactionId ||
            data.checkout_request_id ||
            "";


        /*
        ================================================
        SAVE PAYMENT INFORMATION
        ================================================
        */

        localStorage.setItem(
            "paymentReference",
            reference
        );

        localStorage.setItem(
            "transactionId",
            transactionId
        );


        /*
        ================================================
        SHOW STK MESSAGE
        ================================================
        */

        btn.textContent =
            "Waiting for Payment...";

        message.textContent =
            "M-PESA payment request sent. Please enter your M-PESA PIN to complete the payment.";


        /*
        ================================================
        START STATUS CHECK
        ================================================
        */

        checkPayment(
            reference
        );


    }catch(error){

        console.error(
            "NYOTA PAYMENT ERROR:",
            error
        );


        message.textContent =
            error.message ||
            "Payment request failed.";


        btn.textContent =
            "Pay Processing Fee";

        btn.disabled = false;

    }

}


/*
====================================================
CHECK PAYMENT STATUS
====================================================
*/

async function checkPayment(reference){

    const btn =
        document.getElementById("payBtn");

    const message =
        document.getElementById("stkMessage");


    let attempts = 0;

    const maxAttempts = 100;


    /*
    ================================================
    CLEAR OLD CHECKER
    ================================================
    */

    if(
        window.paymentChecker
    ){

        clearInterval(
            window.paymentChecker
        );

    }


    /*
    ================================================
    STATUS MESSAGE
    ================================================
    */

    message.textContent =
        "Waiting for M-PESA payment confirmation...";

    ================================================
    CHECK EVERY 3 SECONDS
    ================================================
    */

    window.paymentChecker =
        setInterval(

                attempts++;


                try{

                    /*
                    IMPORTANT:
                    ONLY ONE https://
                    */

                    const response =
                        await fetch(

                            encodeURIComponent(
                                reference
                            ),

                            {
                                method:"GET",
                                cache:"no-store"
                            }

                        );


                    const data =
                        await response
                            .json()
                            .catch(
                                () => ({})
                            );


                    console.log(
                        "NYOTA PAYMENT STATUS:",
                        data
                    );


                    /*
                    ========================================
                    PAYMENT COMPLETED
                    ========================================
                    */

                    if(

                        data.status ===
                            "COMPLETED"

                        ||

                        data.status ===
                            "SUCCESS"

                    ){

                        clearInterval(
                            window.paymentChecker
                        );


                        message.textContent =
                            "Payment successful. Redirecting...";


                        btn.textContent =
                            "Payment Successful";


                        btn.disabled =
                            true;


                        localStorage.setItem(
                            "paymentStatus",
                            "COMPLETED"
                        );


                        if(
                            data.reference
                        ){

                            localStorage.setItem(
                                "paymentReference",
                                data.reference
                            );

                        }


                        if(
                            data.transactionId
                        ){

                            localStorage.setItem(
                                "transactionId",
                                data.transactionId
                            );

                        }


                        if(
                            data.mpesaReceipt
                        ){

                            localStorage.setItem(
                                "mpesaReceipt",
                                data.mpesaReceipt
                            );

                        }


                        /*
                        ====================================
                        REDIRECT
                        ====================================
                        */

                        setTimeout(
                            function(){

                                window.location.replace(
                                    "delivery.html"
                                );

                            },
                            1000
                        );


                        return;

                    }


                    /*
                    ========================================
                    PAYMENT FAILED
                    ========================================
                    */

                    if(
                        data.status ===
                        "FAILED"
                    ){

                        clearInterval(
                            window.paymentChecker
                        );


                        message.textContent =
                            "Payment failed. Please try again.";


                        btn.textContent =
                            "Pay Processing Fee";

                        btn.disabled =
                            false;


                        return;

                    }


                    /*
                    ========================================
                    PAYMENT EXPIRED
                    ========================================
                    */

                    if(
                        data.status ===
                        "EXPIRED"
                    ){

                        clearInterval(
                            window.paymentChecker
                        );


                        message.textContent =
                            "The payment request expired. Please try again.";


                        btn.textContent =
                            "Pay Processing Fee";

                        btn.disabled =
                            false;


                        return;

                    }


                    /*

                    if(
                        attempts >=
