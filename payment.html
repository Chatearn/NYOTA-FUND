<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYUTAA Funds - Payment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="payment-page">

    <div class="payment-card">

        <h1>Application Summary</h1>

        <p class="subtitle">
            Please review your selected fund amount.
        </p>

        <div class="amount-box">
            <span>Selected Amount</span>
            <strong id="selectedAmount">Loading...</strong>
        </div>

        <div class="notice">
            <p>
                Your application has been received.
                Continue to request the payment prompt.
            </p>
        </div>

        <button
            type="button"
            class="continue-btn"
            id="continueButton"
            onclick="continueApplication()">
            CONTINUE
        </button>

        <button
            type="button"
            class="back-btn"
            onclick="history.back()">
            BACK
        </button>

        <p id="statusMessage"></p>

    </div>

</div>


<script>

/* =========================================
   RENDER BACKEND
========================================= */

const BACKEND_URL =
    "https://nyota-backed1.onrender.com";


/* =========================================
   GET DATA
========================================= */

const selectedAmount =
    localStorage.getItem("nyutaSelectedAmount");

const phone =
    localStorage.getItem("phone");


/* =========================================
   ELEMENTS
========================================= */

const amountElement =
    document.getElementById("selectedAmount");

const statusMessage =
    document.getElementById("statusMessage");

const continueButton =
    document.getElementById("continueButton");


/* =========================================
   DISPLAY AMOUNT
========================================= */

if (selectedAmount) {

    amountElement.textContent =
        "KSh " +
        Number(selectedAmount).toLocaleString();

} else {

    amountElement.textContent =
        "No amount selected";
}


/* =========================================
   CONTINUE
========================================= */

async function continueApplication() {

    /* -----------------------------
       CHECK AMOUNT
    ----------------------------- */

    if (!selectedAmount) {

        statusMessage.textContent =
            "Please select a fund amount first.";

        return;
    }


    /* -----------------------------
       CHECK PHONE
    ----------------------------- */

    if (!phone) {

        statusMessage.textContent =
            "M-Pesa phone number is missing.";

        return;
    }


    /* -----------------------------
       DISABLE BUTTON
    ----------------------------- */

    continueButton.disabled = true;

    continueButton.textContent =
        "PROCESSING...";

    statusMessage.textContent =
        "Sending payment request...";


    try {

        /* -----------------------------
           SEND TO RENDER
        ----------------------------- */

        const response = await fetch(

            BACKEND_URL + "/api/stkpush",

            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    phone: phone,

                    amount:
                        Number(selectedAmount),

                    reference:
                        "NYOTA-" + Date.now(),

                    description:
                        "NYOTA Payment"

                })

            }
        );


        /* -----------------------------
           READ RESPONSE
        ----------------------------- */

        const data =
            await response.json();

        console.log(
            "NYOTA SERVER RESPONSE:",
            data
        );


        /* -----------------------------
           SERVER ERROR
        ----------------------------- */

        if (!response.ok || !data.success) {

            throw new Error(

                data.message ||
                "STK Push request failed."

            );

        }


        /* -----------------------------
           SUCCESS
        ----------------------------- */

        statusMessage.textContent =
            "STK Push sent. Please check your M-Pesa phone.";

        continueButton.textContent =
            "PROMPT SENT";


        /* -----------------------------
           SAVE TRANSACTION
        ----------------------------- */

        if (data.transactionId) {

            localStorage.setItem(
                "nyotaTransactionId",
                data.transactionId
            );

        }

        if (data.reference) {

            localStorage.setItem(
                "nyotaPaymentReference",
                data.reference
            );

        }

    } catch (error) {

        console.error(
            "NYOTA PAYMENT ERROR:",
            error
        );


        statusMessage.textContent =
            error.message ||
            "Unable to send STK Push.";


        continueButton.disabled =
            false;

        continueButton.textContent =
            "TRY AGAIN";

    }

}

</script>

</body>
</html>
