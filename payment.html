<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYOTA FUNDS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px 10px;
    font-family:Arial,sans-serif;

    /* GREEN BACKGROUND */
    background:#00A651;

    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.card{
    width:100%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    padding:22px 18px 18px;
    border-radius:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    /* BLACK FRAME */
    border:1px solid #000000;
}

h1{
    text-align:center;

    /* YELLOW LETTERS */
    color:#FFD400;

    /* GREY BORDER AROUND YELLOW LETTERS */
    -webkit-text-stroke:1px #808080;

    font-size:22px;
    font-weight:700;
    margin:2px 0 16px;
}

p{
    text-align:center;
    font-size:14px;
    line-height:1.5;
    color:#FFFFFF;
}

.amount{
    background:#00A651;

    /* BLACK FRAME */
    border:1px solid #000000;

    border-radius:12px;
    padding:14px 10px;
    font-size:20px;
    font-weight:700;
    text-align:center;

    /* YELLOW LETTERS */
    color:#FFD400;

    /* GREY BORDER AROUND YELLOW LETTERS */
    -webkit-text-stroke:0.7px #808080;

    margin:18px 0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-size:14px;
    font-weight:700;
    color:#FFFFFF;
}

input{
    width:100%;
    padding:14px 12px;

    /* BLACK FRAME */
    border:1px solid #000000;

    border-radius:10px;
    font-size:16px;

    background:#FFFFFF;
    color:#000000;

    outline:none;
}

input::placeholder{
    color:#666666;
}

input:focus{
    border-color:#000000;

    box-shadow:
        0 0 0 3px rgba(128,128,128,0.25);
}

button{
    width:100%;
    padding:15px;
    margin-top:17px;

    /* YELLOW BUTTON */
    background:#FFD400;

    /* BLACK LETTERS */
    color:#000000;

    /* BLACK FRAME */
    border:1px solid #000000;

    border-radius:11px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30);
}

button:hover{
    background:#FFD400;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    background:#FFD400;
    color:#000000;
    cursor:not-allowed;
    box-shadow:none;
    opacity:.6;
}

#stkMessage{
    min-height:20px;
    margin-top:13px;

    /* YELLOW LETTERS */
    color:#FFD400;

    /* GREY BORDER AROUND YELLOW LETTERS */
    -webkit-text-stroke:0.4px #808080;

    font-size:13px;
    font-weight:600;
    line-height:1.5;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:18px 13px 15px;
        border-radius:15px;
    }

    h1{
        font-size:20px;
    }

    button{
        padding:14px;
        font-size:15px;
    }

}

</style>

</head>

<body>

<div class="card">

<p>
Welcome, <strong><span id="name"></span></strong>
</p>

<p>

please complete the processing fee payment below.
</p>

<div class="amount" id="feeAmount">
Processing Fee: KSh 350
</div>
